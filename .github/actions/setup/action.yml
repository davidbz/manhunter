name: Set up Bun workspace
description: Install Bun, restore the install cache, and install workspace dependencies frozen to bun.lock.

inputs:
  bun-version:
    description: Exact Bun version to install.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Cache Bun install cache
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ inputs.bun-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-${{ inputs.bun-version }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
